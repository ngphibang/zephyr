CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=6
# Camera frames + PXP output + the overlay's drawing frame, 720p BGRX32
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=18432000
CONFIG_VIDEO_ROTATION_ANGLE=270
CONFIG_VIDEO_FRAME_WIDTH=1280
CONFIG_VIDEO_FRAME_HEIGHT=720

# Optimized int8 kernels for the Cortex-M7
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Twelve elements negotiate on the player worker, and the queue threads drive
# the drawing and inference chains
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=8192
CONFIG_MPIPE_THREAD_STACK_SIZE=8192
