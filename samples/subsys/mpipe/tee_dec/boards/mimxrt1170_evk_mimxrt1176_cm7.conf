# main() mounts FATFS and writes the test input file out to the SD card,
# which the default main stack does not cover.
CONFIG_MAIN_STACK_SIZE=2560

# The pooled threads carry the whole chain: file read and parse, JPEG decode
# and display, and the second branch's file writes, which the default stack
# does not cover.
CONFIG_MPIPE_THREAD_STACK_SIZE=2048

# The decoded frame is smaller than the panel: display_write() needs a framebuffer
CONFIG_MCUX_LCDIFV2_FB_NUM=1

# Decoder output frames: the decoder's own queue plus the frame kept on screen
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
