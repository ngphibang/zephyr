# The camera frame is shown as captured, with no rotation stage, so it has to
# fit the 720x1280 panel: 640x480 does, in portrait
CONFIG_VIDEO_FRAME_WIDTH=640
CONFIG_VIDEO_FRAME_HEIGHT=480
CONFIG_JPEG_IMAGE_WIDTH=320
CONFIG_JPEG_IMAGE_HEIGHT=240
CONFIG_PIP_X=32
CONFIG_PIP_Y=32

# Video buffers of every pool in the image: the camera's own queue, the frame
# kept on screen, the decoder's two output frames, slack
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=8
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=4194304

# The planes scan the pipelines' buffers out: no driver framebuffer
CONFIG_MCUX_LCDIFV2_FB_NUM=0
