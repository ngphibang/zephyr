CONFIG_LOG=y

# main() mounts the filesystem and writes the input file before starting the
# pipelines, which the default main stack does not cover.
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
# One streaming thread and one player per pipeline
CONFIG_MPIPE_THREADS_NUM=2
CONFIG_MPIPE_PLAYER_NUM=2
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_FS=y
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_IMG_JPEG_DECODER=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y
# Buffer headers in flight: the camera's frames (one on screen, one being
# captured, slack) plus the file chunks, every frame of a chunk cut as a view
# at once, and the decoded frames of the window
CONFIG_MPIPE_NET_BUF_POOL_COUNT=24
# Largest estimated size for a 320x240 JPEG image
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=153600
CONFIG_MPIPE_FS_BLOCK_SIZE=65536
CONFIG_MPIPE_FS_NUM_BUFS=4
# Decoded frames: one on screen, one being decoded
CONFIG_MPIPE_IMG_JPEG_DECODER_POOL_NUM=2

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
