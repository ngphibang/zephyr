# Video buffers of every pool in the image: the camera's own queue plus the
# PXP's input, the PXP's output in flight and the frame kept on screen, slack;
# six 1280x720 BGRX32 frames of 3.7 MB each plus the heap's own overhead
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=6
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=22183936
CONFIG_VIDEO_ROTATION_ANGLE=270
CONFIG_VIDEO_FRAME_WIDTH=1280
CONFIG_VIDEO_FRAME_HEIGHT=720
CONFIG_MPIPE_BASE_CAPS_FILTER=y
