# The decoded frame is smaller than the panel: display_write() needs a framebuffer
CONFIG_MCUX_LCDIFV2_FB_NUM=1

# Decoder and converter output frames: each device's own queue plus the frame
# kept on screen
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=615200
CONFIG_VIDEO_ROTATION_ANGLE=90

CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_CONVERT=y
CONFIG_MPIPE_IMG_JPEG_DECODER=y
