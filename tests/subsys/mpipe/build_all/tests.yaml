tests:

  mpipe.core.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64

  mpipe.utils.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_DUMP=y
      - CONFIG_MPIPE_PLAYER=y
      - CONFIG_MPIPE_PLAYER_DUMP_ON_STATE_CHANGE=y

  mpipe.base.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_BASE=y
      - CONFIG_MPIPE_BASE_APP_SINK=y
      - CONFIG_MPIPE_BASE_APP_SRC=y
      - CONFIG_MPIPE_BASE_CAPS_FILTER=y
      - CONFIG_MPIPE_BASE_QUEUE=y
      - CONFIG_MPIPE_BASE_TEE=y

  mpipe.disp.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_DISP=y

  mpipe.vid.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_VID=y
      - CONFIG_MPIPE_VID_CONVERT=y
      - CONFIG_MPIPE_VID_OVERLAY=y

  mpipe.img.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_IMG=y

  mpipe.fs.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_FS=y

  mpipe.aud.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_I2S=y
      - CONFIG_AUDIO_DMIC=y
      - CONFIG_AUDIO_CODEC=y
      - CONFIG_MPIPE_AUD=y

  mpipe.ai.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_AI=y
      - CONFIG_MPIPE_AI_CONVERT=y
      - CONFIG_MPIPE_AI_INFER=y
      - CONFIG_MPIPE_AI_DECODE=y

  mpipe.ai.tflm.build:
    tags:
      - subsys
      - mpipe
    modules:
      - tflite-micro
    build_only: true
    platform_allow:
      - qemu_x86_64
      - mimxrt1170_evk/mimxrt1176/cm7
    extra_args:
      - CONFIG_CPP=y
      - CONFIG_STD_CPP17=y
      - CONFIG_TENSORFLOW_LITE_MICRO=y
      - CONFIG_MPIPE_AI=y
      - CONFIG_MPIPE_AI_CONVERT=y
      - CONFIG_MPIPE_AI_INFER=y
      - CONFIG_MPIPE_AI_DECODE=y
      - CONFIG_MPIPE_AI_BACKEND_TFLM=y
